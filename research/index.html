<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#161d47;color:#f1f4fb;
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:360px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:#9BD0E8;margin-bottom:6px}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
p.s{font-size:13px;color:#a8b6e0;margin-bottom:22px;line-height:1.5}
label.f{display:block;font-size:12px;color:#a8b6e0;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:22px;letter-spacing:.3em;text-align:center;
 padding:13px 14px;border-radius:12px;border:1px solid #3a4a8f;background:#233166;color:#f1f4fb;outline:none}
input[type=password]:focus{border-color:#9BD0E8}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:13px;color:#a8b6e0}
.row input{width:17px;height:17px;accent-color:#9BD0E8}
button{width:100%;font:inherit;font-size:15px;font-weight:800;padding:13px;border:0;border-radius:12px;
 background:#9BD0E8;color:#12193c;cursor:pointer}
button:disabled{opacity:.5}
.err{min-height:20px;font-size:12.5px;color:#f2a3a3;margin-top:12px;text-align:center}
.foot{margin-top:26px;font-size:11px;color:#7c8ac0;text-align:center;line-height:1.7}
.foot b{color:#a8b6e0;font-weight:600}
</style>

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
var enc=b64(DATA), iv=b64(IV), salt=b64(SALT);
var f=document.getElementById("f"), pw=document.getElementById("pw"), err=document.getElementById("err"),

function show(html){ document.open(); document.write(html); document.close(); }
async function keyFrom(pass){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},base,

async function open(key){

async function tryRemembered(){
